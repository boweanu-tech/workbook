<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="70mm" height="50mm" viewBox="0 0 70 50">
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 0.45;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-dasharray: 1 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif;
        font-size: 4px;
        font-style: normal;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 正方形。PはA-B-Cの順、QはDからCへ動く。 -->
  <path class="main" d="M 16 40 L 52 40 L 52 4 L 16 4 Z"/>

  <!-- 移動方向 -->
  <path class="thin" d="M 20 44 L 38 44"/>
  <path class="thin" d="M 38 44 L 36.6 43.2 M 38 44 L 36.6 44.8"/>
  <path class="thin" d="M 56 36 L 56 18"/>
  <path class="thin" d="M 56 18 L 55.2 19.4 M 56 18 L 56.8 19.4"/>
  <path class="thin" d="M 20 0 L 38 0"/>
  <path class="thin" d="M 38 0 L 36.6 -0.8 M 38 0 L 36.6 0.8"/>

  <!-- 動く点の例示 -->
  <circle class="point" cx="52" cy="24" r="0.4"/>
  <circle class="point" cx="36" cy="4" r="0.4"/>
  <line class="thin" x1="16" y1="4" x2="36" y2="4"/>
  <line class="thin" x1="16" y1="4" x2="52" y2="24"/>
  <line class="thin" x1="36" y1="4" x2="52" y2="24"/>

  <!-- ラベル -->
  <text class="label" x="12" y="44">A</text>
  <text class="label" x="53" y="44">B</text>
  <text class="label" x="53" y="4">C</text>
  <text class="label" x="12" y="4">D</text>
  <text class="label" x="53" y="26">P</text>
  <text class="label" x="36" y="2">Q</text>
</svg>
