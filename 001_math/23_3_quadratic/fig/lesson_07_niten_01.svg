<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="90mm" height="65mm" viewBox="0 0 180 130" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <!--
  図形教材SVG。
  - viewBox の 1 単位を 1mm として扱う。
  - 底面が1辺6cmの正方形、AE=8cmの直方体 ABCD-EFGH。
  - P は EF 上、Q は FG 上、EP=FQ。
  - 三角錐 B-FPQ を考える問題用。
  -->
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 1.1;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.8;
        fill: none;
        stroke-dasharray: 4 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "Latin Modern Roman", "Times New Roman", serif;
        font-size: 8px;
        font-style: italic;
        fill: black;
      }
      .dim {
        font-family: serif;
        font-size: 7px;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 底面 ABCD -->
  <line class="main" x1="22" y1="100" x2="104" y2="100" />
  <line class="main" x1="104" y1="100" x2="145" y2="72" />
  <line class="dash" x1="145" y1="72" x2="63" y2="72" />
  <line class="dash" x1="63" y1="72" x2="22" y2="100" />

  <!-- 縦の辺 -->
  <line class="main" x1="22" y1="100" x2="22" y2="36" />
  <line class="main" x1="104" y1="100" x2="104" y2="36" />
  <line class="main" x1="145" y1="72" x2="145" y2="8" />
  <line class="dash" x1="63" y1="72" x2="63" y2="8" />

  <!-- 上面 EFGH -->
  <line class="main" x1="22" y1="36" x2="104" y2="36" />
  <line class="main" x1="104" y1="36" x2="145" y2="8" />
  <line class="main" x1="145" y1="8" x2="63" y2="8" />
  <line class="main" x1="63" y1="8" x2="22" y2="36" />

  <!-- P, Q -->
  <circle class="point" cx="56" cy="36" r="2.0" />
  <circle class="point" cx="118" cy="26.4" r="2.0" />

  <!-- 三角錐 B-FPQ の辺 -->
  <line class="thin" x1="104" y1="100" x2="56" y2="36" />
  <line class="thin" x1="104" y1="100" x2="118" y2="26.4" />
  <line class="thin" x1="56" y1="36" x2="118" y2="26.4" />

  <!-- EP=FQ の印 -->
  <line class="thin" x1="39" y1="33" x2="39" y2="39" />
  <line class="thin" x1="111.2" y1="32.1" x2="115.3" y2="38.1" />

  <!-- 頂点ラベル -->
  <text class="label" x="14" y="104">A</text>
  <text class="label" x="106" y="104">B</text>
  <text class="label" x="147" y="76">C</text>
  <text class="label" x="56" y="74">D</text>
  <text class="label" x="14" y="34">E</text>
  <text class="label" x="106" y="34">F</text>
  <text class="label" x="147" y="8">G</text>
  <text class="label" x="55" y="6">H</text>
  <text class="label" x="57" y="31">P</text>
  <text class="label" x="121" y="24">Q</text>

  <!-- 寸法 -->
  <text class="dim" x="56" y="112">6cm</text>
  <text class="dim" x="5" y="70">8cm</text>
</svg>
