<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="70mm" height="50mm" viewBox="0 0 70 50">
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 0.45;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-dasharray: 1 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif;
        font-size: 4px;
        font-style: normal;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 長方形。PはAからBへ、QはCからDへ動く。 -->
  <path class="main" d="M 10 38 L 60 38 L 60 14 L 10 14 Z"/>

  <!-- 移動方向 -->
  <path class="thin" d="M 15 42 L 32 42"/>
  <path class="thin" d="M 32 42 L 30.6 41.2 M 32 42 L 30.6 42.8"/>
  <path class="thin" d="M 55 10 L 36 10"/>
  <path class="thin" d="M 36 10 L 37.4 9.2 M 36 10 L 37.4 10.8"/>

  <!-- 動く点の例示 -->
  <circle class="point" cx="27" cy="38" r="0.4"/>
  <circle class="point" cx="42" cy="14" r="0.4"/>
  <line class="thin" x1="27" y1="38" x2="42" y2="14"/>

  <!-- ラベル -->
  <text class="label" x="6" y="42">A</text>
  <text class="label" x="61" y="42">B</text>
  <text class="label" x="61" y="13">C</text>
  <text class="label" x="6" y="13">D</text>
  <text class="label" x="26" y="45">P</text>
  <text class="label" x="42" y="12">Q</text>
</svg>
