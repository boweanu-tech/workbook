<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="90mm" height="65mm" viewBox="0 0 180 130" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <!--
  図形教材SVG。
  - viewBox の 1 単位を 1mm として扱う。
  - 1辺10cmの立方体 ABCD-EFGH。
  - P は AB 上、Q は AD 上、AP:AQ=2:3。
  - 3点 E, P, Q を通る平面で切断し、三角錐 E-APQ を切り取る問題用。
  -->
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 1.1;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.8;
        fill: none;
        stroke-dasharray: 4 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .cut-fill {
        fill: #eeeeee;
        stroke: none;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "Latin Modern Roman", "Times New Roman", serif;
        font-size: 8px;
        font-style: italic;
        fill: black;
      }
      .dim {
        font-family: serif;
        font-size: 7px;
        fill: black;
      }
      .ratio {
        font-family: serif;
        font-size: 7px;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 頂点座標 -->
  <!-- A(28,100), B(112,100), C(150,72), D(66,72) -->
  <!-- E(28,42), F(112,42), G(150,14), H(66,14) -->

  <!-- 切断面 EPQ -->
  <polygon class="cut-fill" points="28,42 61.6,100 50.8,83.2" />

  <!-- 底面 ABCD -->
  <line class="main" x1="28" y1="100" x2="112" y2="100" />
  <line class="main" x1="112" y1="100" x2="150" y2="72" />
  <line class="dash" x1="150" y1="72" x2="66" y2="72" />
  <line class="main" x1="66" y1="72" x2="28" y2="100" />

  <!-- 縦の辺 -->
  <line class="main" x1="28" y1="100" x2="28" y2="42" />
  <line class="main" x1="112" y1="100" x2="112" y2="42" />
  <line class="main" x1="150" y1="72" x2="150" y2="14" />
  <line class="dash" x1="66" y1="72" x2="66" y2="14" />

  <!-- 上面 EFGH -->
  <line class="main" x1="28" y1="42" x2="112" y2="42" />
  <line class="main" x1="112" y1="42" x2="150" y2="14" />
  <line class="main" x1="150" y1="14" x2="66" y2="14" />
  <line class="main" x1="66" y1="14" x2="28" y2="42" />

  <!-- 三角錐 E-APQ の辺 -->
  <line class="thin" x1="28" y1="42" x2="61.6" y2="100" />
  <line class="thin" x1="28" y1="42" x2="50.8" y2="83.2" />
  <line class="thin" x1="61.6" y1="100" x2="50.8" y2="83.2" />

  <!-- P, Q -->
  <circle class="point" cx="61.6" cy="100" r="2.0" />
  <circle class="point" cx="50.8" cy="83.2" r="2.0" />

  <!-- 比の補助表示 -->
  <text class="ratio" x="39" y="108">2</text>
  <text class="ratio" x="42" y="91">3</text>

  <!-- 頂点ラベル -->
  <text class="label" x="20" y="105">A</text>
  <text class="label" x="114" y="105">B</text>
  <text class="label" x="152" y="76">C</text>
  <text class="label" x="58" y="72">D</text>
  <text class="label" x="20" y="40">E</text>
  <text class="label" x="114" y="40">F</text>
  <text class="label" x="152" y="14">G</text>
  <text class="label" x="58" y="12">H</text>
  <text class="label" x="62" y="109">P</text>
  <text class="label" x="52" y="90">Q</text>

  <!-- 寸法 -->
  <text class="dim" x="66" y="115">10cm</text>
  <text class="dim" x="5" y="73">10cm</text>
</svg>
