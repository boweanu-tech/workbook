<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="70mm" height="50mm" viewBox="0 0 70 50">
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 0.45;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.25;
        fill: none;
        stroke-dasharray: 1 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif;
        font-size: 4px;
        font-style: normal;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 直角三角形。PはAからBへ、QはBからCへ動く。 -->
  <path class="main" d="M 12 8 L 12 40 L 56 40 Z"/>
  <path class="thin" d="M 12 36 L 16 36 L 16 40"/>

  <!-- 動く点の例示 -->
  <circle class="point" cx="12" cy="26" r="0.4"/>
  <circle class="point" cx="39" cy="40" r="0.4"/>
  <line class="thin" x1="12" y1="26" x2="39" y2="40"/>

  <!-- 移動方向 -->
  <path class="thin" d="M 8 14 L 8 29"/>
  <path class="thin" d="M 8 29 L 7.2 27.6 M 8 29 L 8.8 27.6"/>
  <path class="thin" d="M 20 44 L 42 44"/>
  <path class="thin" d="M 42 44 L 40.6 43.2 M 42 44 L 40.6 44.8"/>

  <!-- ラベル -->
  <text class="label" x="8" y="8">A</text>
  <text class="label" x="8" y="44">B</text>
  <text class="label" x="57" y="44">C</text>
  <text class="label" x="14" y="27">P</text>
  <text class="label" x="39" y="38">Q</text>
</svg>
