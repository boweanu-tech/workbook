<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="16mm" viewBox="0 0 120 16">
  <title>数直線3：分数で表す目盛り</title>
  <desc>template.svg準拠。x=12+48(v+1)、軸の高さは7.5。-1から1まで0.25刻み。点名は上、数値は下。</desc>
  <defs>
    <style><![CDATA[
      .main { stroke: black; stroke-width: 0.55; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: black; stroke-width: 0.32; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .axis-arrow, .point { fill: black; stroke: none; }
      .label { font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif; font-size: 4.1px; font-style: normal; fill: black; text-anchor: middle; }
    ]]></style>
  </defs>
  <line class="main" x1="4" y1="7.5" x2="117" y2="7.5"/>
  <polygon class="axis-arrow" points="119,7.5 116.3,6.55 116.3,8.45"/>
  <g class="thin">
    <line x1="12" y1="6.2" x2="12" y2="8.8"/>
    <line x1="24" y1="6.2" x2="24" y2="8.8"/>
    <line x1="36" y1="6.2" x2="36" y2="8.8"/>
    <line x1="48" y1="6.2" x2="48" y2="8.8"/>
    <line x1="60" y1="6.2" x2="60" y2="8.8"/>
    <line x1="72" y1="6.2" x2="72" y2="8.8"/>
    <line x1="84" y1="6.2" x2="84" y2="8.8"/>
    <line x1="96" y1="6.2" x2="96" y2="8.8"/>
    <line x1="108" y1="6.2" x2="108" y2="8.8"/>
  </g>
  <g class="point">
    <circle cx="24" cy="7.5" r="0.65" data-name="G" data-value="-0.75"/>
    <circle cx="72" cy="7.5" r="0.65" data-name="H" data-value="0.25"/>
    <circle cx="96" cy="7.5" r="0.65" data-name="I" data-value="0.75"/>
  </g>
  <g class="label">
    <text x="24" y="3.8">G</text>
    <text x="72" y="3.8">H</text>
    <text x="96" y="3.8">I</text>
    <text x="12" y="13.6" data-value="-1">-1</text>
    <text x="60" y="13.6" data-value="0">0</text>
    <text x="108" y="13.6" data-value="1">1</text>
  </g>
</svg>
