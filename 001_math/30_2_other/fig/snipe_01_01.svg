<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="90mm"
   height="60mm"
   viewBox="0 0 90 60"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <!--
  円に内接する四角形 ABCD。

  数学座標:
    A=(0,0), C=(7,0)
    B=(-3/7,12sqrt(3)/7), D=(2,-sqrt(3)), E=(7/3,0)
  よって AB=3, BC=8, AC=7, AD=sqrt(7), DC=2sqrt(7)。
  D, E を結ぶ直線は角 ADC の二等分線であり、AE:EC=1:2。
  円の中心は (7/2,7/(2sqrt(3)))、半径は 7/sqrt(3)。

  template.svg の線幅・点・ローマン体ラベルの指定を使用する。
  -->
  <defs>
    <style><![CDATA[
      .main {
        stroke: black;
        stroke-width: 0.55;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.32;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .point {
        fill: black;
        stroke: none;
      }
      .label {
        font-family: "CMU Serif", "Computer Modern Serif",
                     "Latin Modern Roman", "Times New Roman", serif;
        font-size: 4.1px;
        font-style: normal;
        fill: black;
      }
    ]]></style>
  </defs>

  <!-- 外接円: 中心 (45,30)、半径 22.2286 -->
  <circle class="main" cx="45" cy="30" r="22.2286" />

  <!-- A-B-C-D-A と対角線 AC -->
  <path class="main"
        d="M 25.75,41.1138 L 23.3940,24.7820 L 64.25,41.1138 L 36.75,50.6409 Z" />
  <line class="main" x1="25.75" y1="41.1138" x2="64.25" y2="41.1138" />

  <!-- 角の二等分線 DE -->
  <line class="thin" x1="36.75" y1="50.6409" x2="38.5833" y2="41.1138" />

  <!-- D における等しい角を表す円弧 -->
  <path class="thin"
        d="M 33.7263,48.0223 A 4,4 0 0 1 37.5059,46.7130" />
  <path class="thin"
        d="M 37.5059,46.7130 A 4,4 0 0 1 40.5296,49.3316" />

  <!-- 頂点と交点 -->
  <circle class="point" cx="25.75" cy="41.1138" r="0.4" />
  <circle class="point" cx="23.3940" cy="24.7820" r="0.4" />
  <circle class="point" cx="64.25" cy="41.1138" r="0.4" />
  <circle class="point" cx="36.75" cy="50.6409" r="0.4" />
  <circle class="point" cx="38.5833" cy="41.1138" r="0.4" />

  <!-- 点名はすべてローマン体 -->
  <text class="label" x="21.8" y="44.8">A</text>
  <text class="label" x="19.0" y="23.0">B</text>
  <text class="label" x="65.7" y="44.8">C</text>
  <text class="label" x="33.5" y="56.0">D</text>
  <text class="label" x="38.0" y="39.3">E</text>
</svg>
