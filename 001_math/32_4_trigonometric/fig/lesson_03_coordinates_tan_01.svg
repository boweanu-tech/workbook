<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="80mm" height="45mm" viewBox="0 0 80 45">
  <defs>
    <style><![CDATA[
      .grid {
        stroke: #b7b7b7;
        stroke-width: 0.20;
        fill: none;
      }
      .frame-guide {
        stroke: #dddddd;
        stroke-width: 0.15;
        fill: none;
      }
      .axis {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
      }
      .axis-arrow,
      .point {
        fill: #000000;
        stroke: none;
      }
      .tick {
        stroke: #000000;
        stroke-width: 0.30;
      }
      .curve {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .asymptote {
        stroke: #000000;
        stroke-width: 0.32;
        fill: none;
        stroke-dasharray: 1.2 1.4;
      }
      .axis-label,
      .tick-label,
      .point-label,
      .frac-text {
        font-family: "CMU Serif", "Latin Modern Roman",
                     "Computer Modern Serif", serif;
        fill: #000000;
      }
      .axis-label {
        font-size: 3.8px;
        font-style: italic;
      }
      .tick-label {
        font-size: 3.0px;
        font-style: normal;
      }
      .point-label {
        font-size: 3.2px;
        font-style: normal;
      }
      .frac-text {
        font-size: 2.7px;
        font-style: normal;
      }
      .frac-line {
        stroke: #000000;
        stroke-width: 0.24;
      }
    ]]></style>
    <clipPath id="graph-clip">
      <rect x="8" y="5" width="64" height="35"/>
    </clipPath>
  </defs>

  <g id="grid-layer">
    <rect class="frame-guide" x="8" y="5" width="64" height="35"/>
    <line class="grid" x1="8"  y1="5" x2="8"  y2="40"/>
    <line class="grid" x1="24" y1="5" x2="24" y2="40"/>
    <line class="grid" x1="40" y1="5" x2="40" y2="40"/>
    <line class="grid" x1="56" y1="5" x2="56" y2="40"/>
    <line class="grid" x1="72" y1="5" x2="72" y2="40"/>
    <line class="grid" x1="8" y1="14.545" x2="72" y2="14.545"/>
    <line class="grid" x1="8" y1="22.5" x2="72" y2="22.5"/>
    <line class="grid" x1="8" y1="30.455" x2="72" y2="30.455"/>
  </g>

  <g id="asymptote-layer">
    <line class="asymptote" x1="8" y1="5" x2="8" y2="40"/>
    <line class="asymptote" x1="72" y1="5" x2="72" y2="40"/>
  </g>

  <g id="axis-layer">
    <line class="axis" x1="6" y1="22.5" x2="72.8" y2="22.5"/>
    <polygon class="axis-arrow" points="75,22.5 72.3,21.55 72.3,23.45"/>
    <line class="axis" x1="40" y1="41" x2="40" y2="5.8"/>
    <polygon class="axis-arrow" points="40,3.6 39.05,6.3 40.95,6.3"/>

    <line class="tick" x1="8"  y1="22" x2="8"  y2="23"/>
    <line class="tick" x1="24" y1="22" x2="24" y2="23"/>
    <line class="tick" x1="56" y1="22" x2="56" y2="23"/>
    <line class="tick" x1="72" y1="22" x2="72" y2="23"/>
    <line class="tick" x1="39.5" y1="14.545" x2="40.5" y2="14.545"/>
    <line class="tick" x1="39.5" y1="30.455" x2="40.5" y2="30.455"/>

    <text class="tick-label" x="36.7" y="25.9">O</text>
    <text class="axis-label" x="75.8" y="23.7">θ</text>
    <text class="axis-label" x="42.0" y="5.0">y</text>

    <g transform="translate(8,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">-π</text>
      <line class="frac-line" x1="-2.8" y1="0.7" x2="2.8" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">2</text>
    </g>
    <g transform="translate(24,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">-π</text>
      <line class="frac-line" x1="-2.8" y1="0.7" x2="2.8" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">4</text>
    </g>
    <g transform="translate(56,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">π</text>
      <line class="frac-line" x1="-2.2" y1="0.7" x2="2.2" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">4</text>
    </g>
    <g transform="translate(72,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">π</text>
      <line class="frac-line" x1="-2.2" y1="0.7" x2="2.2" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">2</text>
    </g>
    <text class="tick-label" x="38.2" y="15.545" text-anchor="end">1</text>
    <text class="tick-label" x="38.2" y="31.455" text-anchor="end">-1</text>
  </g>

  <g id="curve-layer" clip-path="url(#graph-clip)">
    <path class="curve"
          d="M 16.691,40
             L 18.634,36.329
             L 20.576,33.706
             L 22.518,31.705
             L 24,30.455
             L 24.461,30.103
             L 26.403,28.769
             L 28.346,27.622
             L 30.288,26.608
             L 32.230,25.690
             L 34.173,24.839
             L 36.115,24.036
             L 38.058,23.261
             L 40,22.5
             L 41.942,21.739
             L 43.885,20.964
             L 45.827,20.161
             L 47.770,19.310
             L 49.712,18.392
             L 51.654,17.378
             L 53.597,16.231
             L 55.539,14.897
             L 56,14.545
             L 57.482,13.295
             L 59.424,11.294
             L 61.366,8.671
             L 63.309,5"/>
  </g>

  <g id="point-layer">
    <circle class="point" cx="24" cy="30.455" r="0.75"/>
    <circle class="point" cx="40" cy="22.5" r="0.75"/>
    <circle class="point" cx="56" cy="14.545" r="0.75"/>
    <text class="point-label" x="21.5" y="33.4">P</text>
    <text class="point-label" x="41.3" y="20.4">Q</text>
    <text class="point-label" x="57.2" y="12.6">R</text>
  </g>
</svg>
