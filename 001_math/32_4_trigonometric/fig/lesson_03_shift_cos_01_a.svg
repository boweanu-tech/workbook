<?xml version="1.0" encoding="UTF-8"?>
<svg width="80mm" height="45mm" viewBox="0 0 80 45" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- y=cos(2(theta+pi/6)), answer graph: -pi <= theta <= pi -->
  <defs>
    <style><![CDATA[
      .axis { stroke:#000; stroke-width:0.42; fill:none; stroke-linecap:round; }
      .axis-arrow { fill:#000; stroke:none; }
