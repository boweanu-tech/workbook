             L 43.885,19.310 L 44.856,18.392 L 45.827,17.378
             L 46.799,16.231 L 47.770,14.897 L 48,14.545
             L 48.741,13.295 L 49.712,11.294 L 50.683,8.671
             L 51.654,5"/>
    <path class="curve"
