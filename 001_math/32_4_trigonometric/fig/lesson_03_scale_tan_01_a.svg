             L 64,30.455 L 64.230,30.103 L 65.202,28.769
             L 66.173,27.622 L 67.144,26.608 L 68.115,25.690
             L 69.087,24.839 L 70.058,24.036 L 71.029,23.261
             L 72,22.5"/>
  </g>
  <circle class="open-point" cx="8" cy="22.5" r="0.72"/>
  <circle class="open-point" cx="72" cy="22.5" r="0.72"/>
</svg>
