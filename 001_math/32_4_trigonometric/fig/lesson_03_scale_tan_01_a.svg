<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="80mm" height="45mm" viewBox="0 0 80 45">
  <!-- y=tan(2 theta), answer graph: -pi/2 < theta < pi/2 -->
  <defs>
    <style><![CDATA[
      .axis { stroke:#000; stroke-width:0.42; fill:none; stroke-linecap:round; }
      .axis-arrow { fill:#000; stroke:none; }
      .tick { stroke:#000; stroke-width:0.30; }
      .curve { stroke:#000; stroke-width:0.42; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .asymptote { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; }
      .open-point { fill:#fff; stroke:#000; stroke-width:0.36; }
      .axis-label, .tick-label, .frac-text {
        font-family:"CMU Serif","Latin Modern Roman","Computer Modern Serif",serif;
        fill:#000;
      }
      .axis-label { font-size:3.8px; font-style:italic; }
      .tick-label { font-size:3.0px; font-style:normal; }
      .frac-text { font-size:2.7px; font-style:normal; }
      .frac-line { stroke:#000; stroke-width:0.24; }
    ]]></style>
    <clipPath id="graph-clip">
      <rect x="8" y="5" width="64" height="35"/>
    </clipPath>
  </defs>

  <line class="axis" x1="6" y1="22.5" x2="72.8" y2="22.5"/>
  <polygon class="axis-arrow" points="75,22.5 72.3,21.55 72.3,23.45"/>
  <line class="axis" x1="40" y1="41" x2="40" y2="5.8"/>
  <polygon class="axis-arrow" points="40,3.6 39.05,6.3 40.95,6.3"/>

  <line class="tick" x1="8"  y1="22" x2="8"  y2="23"/>
  <line class="tick" x1="16" y1="22" x2="16" y2="23"/>
  <line class="tick" x1="24" y1="22" x2="24" y2="23"/>
  <line class="tick" x1="32" y1="22" x2="32" y2="23"/>
  <line class="tick" x1="48" y1="22" x2="48" y2="23"/>
  <line class="tick" x1="56" y1="22" x2="56" y2="23"/>
  <line class="tick" x1="64" y1="22" x2="64" y2="23"/>
  <line class="tick" x1="72" y1="22" x2="72" y2="23"/>
  <line class="tick" x1="39.5" y1="14.545" x2="40.5" y2="14.545"/>
  <line class="tick" x1="39.5" y1="30.455" x2="40.5" y2="30.455"/>

  <text class="tick-label" x="36.7" y="21.0">O</text>
  <text class="axis-label" x="75.8" y="23.7">θ</text>
  <text class="axis-label" x="42" y="5">y</text>
  <g transform="translate(8,25.7)">
    <text class="frac-text" x="0" y="0" text-anchor="middle">−π</text>
    <line class="frac-line" x1="-2.8" y1="0.7" x2="2.8" y2="0.7"/>
    <text class="frac-text" x="0" y="3.0" text-anchor="middle">2</text>
  </g>
  <g transform="translate(24,25.7)">
    <text class="frac-text" x="0" y="0" text-anchor="middle">−π</text>
    <line class="frac-line" x1="-2.8" y1="0.7" x2="2.8" y2="0.7"/>
    <text class="frac-text" x="0" y="3.0" text-anchor="middle">4</text>
  </g>
  <g transform="translate(56,25.7)">
    <text class="frac-text" x="0" y="0" text-anchor="middle">π</text>
    <line class="frac-line" x1="-2.2" y1="0.7" x2="2.2" y2="0.7"/>
    <text class="frac-text" x="0" y="3.0" text-anchor="middle">4</text>
  </g>
  <g transform="translate(72,25.7)">
