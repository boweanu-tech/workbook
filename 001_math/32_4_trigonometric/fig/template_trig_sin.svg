<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="80mm" height="45mm" viewBox="0 0 80 45">
  <!--
  三角関数グラフ用雛形（sin）。
  保存先: 001_math/32_4_trigonometric/fig/

  初期状態は問題用の空グラフ。
  解答図を作るときは answer-layer の display:none を外し、
  表示範囲・目盛・曲線を対象の式に合わせて変更する。
  座標読取図を作るときは annotation-layer の見本を複製し、
  点ごとに縦または横の補助線だけを残す。

  標準表示:
  - theta: -2pi ～ 2pi
  - y: -1.4 ～ 1.4
  - theta目盛: pi/2 間隔
  - y目盛: -1, 0, 1
  - 灰色の罫線・外枠: なし
  -->
  <defs>
    <style><![CDATA[
      .axis {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
      }
      .axis-arrow,
      .point {
        fill: #000000;
        stroke: none;
      }
      .tick {
        stroke: #000000;
        stroke-width: 0.30;
      }
      .curve {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .guide {
        stroke: #000000;
        stroke-width: 0.32;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 1.2 1.4;
      }
      .axis-label,
      .tick-label,
      .point-label {
        font-family: "CMU Serif", "Latin Modern Roman",
                     "Computer Modern Serif", serif;
        fill: #000000;
      }
      .axis-label {
        font-size: 3.8px;
        font-style: italic;
      }
      .tick-label {
        font-size: 3.0px;
        font-style: normal;
      }
      .point-label {
        font-size: 3.2px;
        font-style: normal;
      }
    ]]></style>
    <clipPath id="graph-clip">
      <rect x="8" y="5" width="64" height="35"/>
    </clipPath>
  </defs>

  <g id="axis-layer">
    <line class="axis" x1="6" y1="22.5" x2="72.8" y2="22.5"/>
    <polygon class="axis-arrow" points="75,22.5 72.3,21.55 72.3,23.45"/>
    <line class="axis" x1="40" y1="41" x2="40" y2="5.8"/>
    <polygon class="axis-arrow" points="40,3.6 39.05,6.3 40.95,6.3"/>
    <line class="tick" x1="8"  y1="22" x2="8"  y2="23"/>
    <line class="tick" x1="16" y1="22" x2="16" y2="23"/>
    <line class="tick" x1="24" y1="22" x2="24" y2="23"/>
    <line class="tick" x1="32" y1="22" x2="32" y2="23"/>
    <line class="tick" x1="48" y1="22" x2="48" y2="23"/>
    <line class="tick" x1="56" y1="22" x2="56" y2="23"/>
    <line class="tick" x1="64" y1="22" x2="64" y2="23"/>
    <line class="tick" x1="72" y1="22" x2="72" y2="23"/>
    <line class="tick" x1="39.5" y1="10.833" x2="40.5" y2="10.833"/>
    <line class="tick" x1="39.5" y1="34.167" x2="40.5" y2="34.167"/>
    <text class="tick-label" x="36.7" y="25.9">O</text>
    <text class="axis-label" x="75.8" y="23.7">θ</text>
    <text class="axis-label" x="42.0" y="5.0">y</text>
    <text class="tick-label" x="8"  y="26.5" text-anchor="middle">-2π</text>
    <text class="tick-label" x="24" y="26.5" text-anchor="middle">-π</text>
    <text class="tick-label" x="56" y="26.5" text-anchor="middle">π</text>
    <text class="tick-label" x="72" y="26.5" text-anchor="middle">2π</text>
    <text class="tick-label" x="38.2" y="11.833" text-anchor="end">1</text>
    <text class="tick-label" x="38.2" y="35.167" text-anchor="end">-1</text>
  </g>

  <!-- 座標読取図の見本。縦線は theta、横線は y を与える場合に使う。 -->
  <g id="annotation-layer" style="display:none">
    <line class="guide" x1="48" y1="22.5" x2="48" y2="10.833"/>
    <line class="guide" x1="40" y1="10.833" x2="48" y2="10.833"/>
    <circle class="point" cx="48" cy="10.833" r="0.75"/>
    <text class="point-label" x="49.2" y="9.5">P</text>
  </g>

  <!-- 問題用では非表示。解答図に複製した後で display:none を外す。 -->
  <g id="answer-layer" style="display:none" clip-path="url(#graph-clip)">
    <path class="curve"
          d="M 8,22.5
             C 10.667,16.391 13.333,10.833 16,10.833
             C 18.667,10.833 21.333,16.391 24,22.5
             C 26.667,28.609 29.333,34.167 32,34.167
             C 34.667,34.167 37.333,28.609 40,22.5
             C 42.667,16.391 45.333,10.833 48,10.833
             C 50.667,10.833 53.333,16.391 56,22.5
             C 58.667,28.609 61.333,34.167 64,34.167
             C 66.667,34.167 69.333,28.609 72,22.5"/>
  </g>
</svg>
