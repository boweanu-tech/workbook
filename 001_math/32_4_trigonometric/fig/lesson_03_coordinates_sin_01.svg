<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="80mm" height="45mm" viewBox="0 0 80 45">
  <defs>
    <style><![CDATA[
      .grid {
        stroke: #b7b7b7;
        stroke-width: 0.20;
        fill: none;
      }
      .frame-guide {
        stroke: #dddddd;
        stroke-width: 0.15;
        fill: none;
      }
      .axis {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
      }
      .axis-arrow,
      .point {
        fill: #000000;
        stroke: none;
      }
      .tick {
        stroke: #000000;
        stroke-width: 0.30;
      }
      .curve {
        stroke: #000000;
        stroke-width: 0.42;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .axis-label,
      .tick-label,
      .point-label,
      .frac-text {
        font-family: "CMU Serif", "Latin Modern Roman",
                     "Computer Modern Serif", serif;
        fill: #000000;
      }
      .axis-label {
        font-size: 3.8px;
        font-style: italic;
      }
      .tick-label {
        font-size: 3.0px;
        font-style: normal;
      }
      .point-label {
        font-size: 3.2px;
        font-style: normal;
      }
      .frac-text {
        font-size: 2.7px;
        font-style: normal;
      }
      .frac-line {
        stroke: #000000;
        stroke-width: 0.24;
      }
    ]]></style>
    <clipPath id="graph-clip">
      <rect x="8" y="5" width="64" height="35"/>
    </clipPath>
  </defs>

  <g id="grid-layer">
    <rect class="frame-guide" x="8" y="5" width="64" height="35"/>
    <line class="grid" x1="8"  y1="5" x2="8"  y2="40"/>
    <line class="grid" x1="24" y1="5" x2="24" y2="40"/>
    <line class="grid" x1="40" y1="5" x2="40" y2="40"/>
    <line class="grid" x1="56" y1="5" x2="56" y2="40"/>
    <line class="grid" x1="72" y1="5" x2="72" y2="40"/>
    <line class="grid" x1="8" y1="10.833" x2="72" y2="10.833"/>
    <line class="grid" x1="8" y1="22.5" x2="72" y2="22.5"/>
    <line class="grid" x1="8" y1="34.167" x2="72" y2="34.167"/>
  </g>

  <g id="axis-layer">
    <line class="axis" x1="6" y1="22.5" x2="72.8" y2="22.5"/>
    <polygon class="axis-arrow" points="75,22.5 72.3,21.55 72.3,23.45"/>
    <line class="axis" x1="8" y1="41" x2="8" y2="5.8"/>
    <polygon class="axis-arrow" points="8,3.6 7.05,6.3 8.95,6.3"/>

    <line class="tick" x1="24" y1="22" x2="24" y2="23"/>
    <line class="tick" x1="40" y1="22" x2="40" y2="23"/>
    <line class="tick" x1="56" y1="22" x2="56" y2="23"/>
    <line class="tick" x1="72" y1="22" x2="72" y2="23"/>
    <line class="tick" x1="7.5" y1="10.833" x2="8.5" y2="10.833"/>
    <line class="tick" x1="7.5" y1="34.167" x2="8.5" y2="34.167"/>

    <text class="tick-label" x="4.7" y="25.9">O</text>
    <text class="axis-label" x="75.8" y="23.7">θ</text>
    <text class="axis-label" x="10.0" y="5.0">y</text>

    <g transform="translate(24,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">π</text>
      <line class="frac-line" x1="-2.2" y1="0.7" x2="2.2" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">2</text>
    </g>
    <text class="tick-label" x="40" y="26.5" text-anchor="middle">π</text>
    <g transform="translate(56,25.7)">
      <text class="frac-text" x="0" y="0" text-anchor="middle">3π</text>
      <line class="frac-line" x1="-3.2" y1="0.7" x2="3.2" y2="0.7"/>
      <text class="frac-text" x="0" y="3.0" text-anchor="middle">2</text>
    </g>
    <text class="tick-label" x="72" y="26.5" text-anchor="middle">2π</text>
    <text class="tick-label" x="6.2" y="11.833" text-anchor="end">1</text>
    <text class="tick-label" x="6.2" y="35.167" text-anchor="end">-1</text>
  </g>

  <g id="curve-layer" clip-path="url(#graph-clip)">
    <path class="curve"
          d="M 8,22.5
             C 13.333,16.391 18.667,10.833 24,10.833
             C 29.333,10.833 34.667,16.391 40,22.5
             C 45.333,28.609 50.667,34.167 56,34.167
             C 61.333,34.167 66.667,28.609 72,22.5"/>
  </g>

  <g id="point-layer">
    <circle class="point" cx="24" cy="10.833" r="0.75"/>
    <circle class="point" cx="40" cy="22.5" r="0.75"/>
    <circle class="point" cx="56" cy="34.167" r="0.75"/>
    <text class="point-label" x="21.8" y="8.6">P</text>
    <text class="point-label" x="41.3" y="20.4">Q</text>
    <text class="point-label" x="57.2" y="37.3">R</text>
  </g>
</svg>
