    <line class="asymptote" x1="40" y1="29.5" x2="40" y2="40"/>
    <line class="asymptote" x1="72" y1="5" x2="72" y2="23"/>
    <line class="asymptote" x1="72" y1="29.5" x2="72" y2="40"/>
    <path class="curve"
          d="M 12.346,40
             L 13.317,36.329 L 14.288,33.706 L 15.259,31.705
             L 16,30.455 L 16.230,30.103 L 17.202,28.769
             L 18.173,27.622 L 19.144,26.608 L 20.115,25.690
             L 21.087,24.839 L 22.058,24.036 L 23.029,23.261
             L 24,22.5
             L 24.971,21.739 L 25.942,20.964 L 26.914,20.161
             L 27.885,19.310 L 28.856,18.392 L 29.827,17.378
             L 30.799,16.231 L 31.770,14.897 L 32,14.545
             L 32.741,13.295 L 33.712,11.294 L 34.683,8.671
             L 35.654,5"/>
    <path class="curve"
          d="M 44.346,40
             L 45.317,36.329 L 46.288,33.706 L 47.259,31.705
             L 48,30.455 L 48.230,30.103 L 49.202,28.769
             L 50.173,27.622 L 51.144,26.608 L 52.115,25.690
             L 53.087,24.839 L 54.058,24.036 L 55.029,23.261
             L 56,22.5
             L 56.971,21.739 L 57.942,20.964 L 58.914,20.161
             L 59.885,19.310 L 60.856,18.392 L 61.827,17.378
             L 62.799,16.231 L 63.770,14.897 L 64,14.545
             L 64.741,13.295 L 65.712,11.294 L 66.683,8.671
             L 67.654,5"/>
