<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="80mm"
  height="45mm"
  viewBox="0 0 80 45"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg">
  <!-- y=sin((theta+pi/2)/2), answer graph: -5pi/2 <= theta <= 3pi/2 -->
  <defs>
    <style><![CDATA[
      .axis { stroke:#000; stroke-width:0.42; fill:none; stroke-linecap:round; }
      .axis-arrow { fill:#000; stroke:none; }
      .tick { stroke:#000; stroke-width:0.30; }
      .curve { stroke:#000; stroke-width:0.42; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .axis-label, .tick-label {
        font-family:"CMU Serif","Latin Modern Roman","Computer Modern Serif",serif;
        fill:#000;
      }
      .axis-label { font-size:3.8px; font-style:italic; }
      .tick-label { font-size:3.0px; font-style:normal; }
    ]]></style>
    <clipPath id="graph-clip">
      <rect x="8" y="5" width="64" height="35" />
    </clipPath>
  </defs>

  <line class="axis" x1="6" y1="22.5" x2="72.8" y2="22.5" />
  <polygon class="axis-arrow" points="72.3,23.45 75,22.5 72.3,21.55" />
  <line class="axis" x1="48" y1="41" x2="48" y2="5.8" />
  <polygon class="axis-arrow" points="48.95,6.3 48,3.6 47.05,6.3" />

  <g class="tick">
    <path d="M8,22 v1 M16,22 v1 M24,22 v1 M32,22 v1 M40,22 v1 M56,22 v1 M64,22 v1 M72,22 v1" />
    <path d="M47.5,10.833 h1 M47.5,34.167 h1" />
  </g>

  <text class="tick-label" x="44.2" y="25.35">O</text>
  <text class="axis-label" x="75.8" y="23.7">&#952;</text>
  <text class="axis-label" x="50" y="5">y</text>
  <text class="tick-label" x="8" y="26.5" text-anchor="middle">&#8722;5&#960;/2</text>
  <text class="tick-label" x="24" y="26.5" text-anchor="middle">&#8722;3&#960;/2</text>
  <text class="tick-label" x="40" y="20.8" text-anchor="middle">&#8722;&#960;/2</text>
  <text class="tick-label" x="56" y="26.5" text-anchor="middle">&#960;/2</text>
  <text class="tick-label" x="72" y="26.5" text-anchor="middle">3&#960;/2</text>
  <text class="tick-label" x="46.2" y="11.833" text-anchor="end">1</text>
  <text class="tick-label" x="46.2" y="35.167" text-anchor="end">&#8722;1</text>

  <g id="answer-layer" clip-path="url(#graph-clip)">
    <path
      class="curve"
      d="M 8.000,22.500
         C 10.667,25.554 13.333,28.590 16.000,30.750
         C 18.667,32.910 21.333,34.167 24.000,34.167
         C 26.667,34.167 29.333,32.910 32.000,30.750
         C 34.667,28.590 37.333,25.554 40.000,22.500
         C 42.667,19.446 45.333,16.410 48.000,14.250
         C 50.667,12.090 53.333,10.833 56.000,10.833
         C 58.667,10.833 61.333,12.090 64.000,14.250
         C 66.667,16.410 69.333,19.446 72.000,22.500" />
  </g>
</svg>
