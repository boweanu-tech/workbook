<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="58mm" height="64mm" viewBox="0 0 58 64">
  <!-- (1)=(-1,4), (2)=(1,5), (3)=(4,-3), (4)=(2,2)。すべて原点始点で終点は格子点。 -->
  <defs>
    <marker id="answer-arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="black"/>
    </marker>
    <style><![CDATA[
      .grid { stroke: #b8b8b8; stroke-width: 0.18; fill: none; }
      .axis { stroke: black; stroke-width: 0.34; fill: none; }
      .answer { stroke: black; stroke-width: 0.7; fill: none; stroke-linecap: round; marker-end: url(#answer-arrow); }
      .point { fill: black; stroke: none; }
      .label, .axis-label {
        font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif;
        fill: black;
      }
      .label { font-size: 3.7px; font-style: normal; }
      .axis-label { font-size: 3.6px; font-style: italic; }
      .origin-label { font-style: normal; }
      .label-bg { fill: white; opacity: 0.92; }
    ]]></style>
  </defs>

  <g class="grid">
    <line x1="6" y1="5" x2="6" y2="60"/><line x1="11.5" y1="5" x2="11.5" y2="60"/>
    <line x1="17" y1="5" x2="17" y2="60"/><line x1="22.5" y1="5" x2="22.5" y2="60"/>
    <line x1="28" y1="5" x2="28" y2="60"/><line x1="33.5" y1="5" x2="33.5" y2="60"/>
    <line x1="39" y1="5" x2="39" y2="60"/><line x1="44.5" y1="5" x2="44.5" y2="60"/>
    <line x1="6" y1="5" x2="44.5" y2="5"/><line x1="6" y1="10.5" x2="44.5" y2="10.5"/>
    <line x1="6" y1="16" x2="44.5" y2="16"/><line x1="6" y1="21.5" x2="44.5" y2="21.5"/>
    <line x1="6" y1="27" x2="44.5" y2="27"/><line x1="6" y1="32.5" x2="44.5" y2="32.5"/>
    <line x1="6" y1="38" x2="44.5" y2="38"/><line x1="6" y1="43.5" x2="44.5" y2="43.5"/>
    <line x1="6" y1="49" x2="44.5" y2="49"/><line x1="6" y1="54.5" x2="44.5" y2="54.5"/>
    <line x1="6" y1="60" x2="44.5" y2="60"/>
  </g>

  <line class="axis" x1="4" y1="38" x2="47" y2="38"/>
  <polygon points="49,38 46.2,37.05 46.2,38.95" fill="black"/>
  <line class="axis" x1="17" y1="62" x2="17" y2="5"/>
  <polygon points="17,3 16.05,5.8 17.95,5.8" fill="black"/>
  <text class="axis-label" x="47" y="42">x</text>
  <text class="axis-label" x="19" y="5.2">y</text>

  <line class="answer" x1="17" y1="38" x2="11.5" y2="16"/>
  <line class="answer" x1="17" y1="38" x2="22.5" y2="10.5"/>
  <line class="answer" x1="17" y1="38" x2="39" y2="54.5"/>
  <line class="answer" x1="17" y1="38" x2="28" y2="27"/>
  <circle class="point" cx="17" cy="38" r="0.42"/>

  <rect class="label-bg" x="5.8" y="11.1" width="7" height="4.8" rx="0.5"/>
  <text class="label" x="6.5" y="14.8">(1)</text>
  <rect class="label-bg" x="22.8" y="5.5" width="7" height="4.8" rx="0.5"/>
  <text class="label" x="23.5" y="9.2">(2)</text>
  <rect class="label-bg" x="39.5" y="53.8" width="7" height="4.8" rx="0.5"/>
  <text class="label" x="40.2" y="57.5">(3)</text>
  <rect class="label-bg" x="28.8" y="22.4" width="7" height="4.8" rx="0.5"/>
  <text class="label" x="29.5" y="26.1">(4)</text>
  <text class="axis-label origin-label" x="13.1" y="42">O</text>
</svg>
