  <defs>
    <style><![CDATA[
      .main { stroke: black; stroke-width: 0.55; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: black; stroke: none; }
      .label {
        font-family: "CMU Serif", "Computer Modern Serif", "Latin Modern Roman", "Times New Roman", serif;
        font-size: 4.1px; font-style: normal; fill: black;
      }
    ]]></style>
  </defs>
  <path class="main" d="M 8 31 L 48 31 L 20 7 Z"/>
  <circle class="point" cx="8" cy="31" r="0.45"/>
  <circle class="point" cx="48" cy="31" r="0.45"/>
  <circle class="point" cx="20" cy="7" r="0.45"/>
  <text class="label" x="3.7" y="35.2">A</text>
  <text class="label" x="49.5" y="35.2">B</text>
