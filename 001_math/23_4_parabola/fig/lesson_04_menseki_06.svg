.sup{font-size:2.8px}
.frac-text{font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;font-size:3.2px;fill:#000}
.frac-line{stroke:#000;stroke-width:.28}
.label-bg{fill:#fff;opacity:.92}
.triangle-fill{fill:#ddd;stroke:none}
.triangle-outline{fill:none;stroke:#000;stroke-width:.55;stroke-linejoin:round}
.arrow{fill:#000}
]]></style></defs>

