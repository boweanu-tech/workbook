<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80mm" height="58mm" viewBox="0 0 80 58">
<defs><style><![CDATA[
.main{stroke:#000;stroke-width:.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#000;stroke-width:.32;fill:none;stroke-linecap:round;stroke-linejoin:round}
.point{fill:#000}
.label,.math-label,.axis-label{
  font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;
