  <circle class="point" cx="10" cy="19" r=".45"/>
  <circle class="point" cx="46" cy="19" r=".45"/>
  <circle class="point" cx="64" cy="47" r=".45"/>
  <circle class="point" cx="28" cy="47" r=".45"/>
