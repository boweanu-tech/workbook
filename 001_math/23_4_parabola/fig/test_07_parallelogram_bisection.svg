  <!-- 数学座標から X=28+9x, Y=47-7y で変換。中点と二等分線は解答情報になるため描かない。 -->
  <defs>
    <style><![CDATA[
      .main{stroke:#000;stroke-width:.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#000;stroke-width:.32;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .point,.axis-arrow{fill:#000;stroke:none}
      .label,.axis-label{font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;fill:#000}
      .label{font-size:4.1px;font-style:normal}.axis-label{font-size:4.1px;font-style:italic}
      .triangle-fill{fill:#eee;stroke:none}.triangle-outline{fill:none;stroke:#000;stroke-width:.55;stroke-linejoin:round}
    ]]></style>
  </defs>
  <polygon class="triangle-fill" points="10,19 46,19 64,47"/>
  <line class="main" x1="3" y1="47" x2="69" y2="47"/>
  <polygon class="axis-arrow" points="71,47 68.3,46.05 68.3,47.95"/>
  <line class="main" x1="28" y1="51" x2="28" y2="4"/>
