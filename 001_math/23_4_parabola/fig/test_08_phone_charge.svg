<?xml version="1.0" encoding="UTF-8"?>
<svg width="60mm" height="42mm" viewBox="0 0 60 42" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- 横軸は通話時間（分）、縦軸は料金（円）。15分超から5分ごとに100円加算。 -->
  <defs>
    <style><![CDATA[
      .main{stroke:#000;stroke-width:.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#000;stroke-width:.32;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .axis-arrow,.closed{fill:#000;stroke:none}.open{fill:#fff;stroke:#000;stroke-width:.4}
      .label,.axis-label{font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;fill:#000}
      .label{font-size:2.7px;font-style:normal}.axis-label{font-size:3.4px;font-style:italic}
    ]]></style>
  </defs>
  <line class="main" x1="10" y1="37" x2="56" y2="37"/>
  <polygon class="axis-arrow" points="58,37 55.3,36.05 55.3,37.95"/>
  <line class="main" x1="11" y1="39" x2="11" y2="4"/>
  <polygon class="axis-arrow" points="11,2 10.05,4.7 11.95,4.7"/>
  <line class="thin" x1="11.5" y1="34" x2="26" y2="34"/>
  <line class="thin" x1="26" y1="29" x2="31" y2="29"/>
  <line class="thin" x1="31" y1="24" x2="36" y2="24"/>
  <line class="thin" x1="36" y1="19" x2="41" y2="19"/>
  <line class="thin" x1="41" y1="14" x2="46" y2="14"/>
  <line class="thin" x1="46" y1="9" x2="51" y2="9"/>
  <circle class="closed" cx="11.5" cy="34" r=".6"/>
  <circle class="closed" cx="26" cy="34" r=".6"/>
  <circle class="open" cx="26" cy="29" r=".65"/>
  <circle class="closed" cx="31" cy="29" r=".6"/>
  <circle class="open" cx="31" cy="24" r=".65"/>
  <circle class="closed" cx="36" cy="24" r=".6"/>
  <circle class="open" cx="36" cy="19" r=".65"/>
  <circle class="closed" cx="41" cy="19" r=".6"/>
  <circle class="open" cx="41" cy="14" r=".65"/>
  <circle class="closed" cx="46" cy="14" r=".6"/>
  <circle class="open" cx="46" cy="9" r=".65"/>
  <circle class="closed" cx="51" cy="9" r=".6"/>
  <g class="thin">
    <line x1="26" y1="36.3" x2="26" y2="37.7"/><line x1="31" y1="36.3" x2="31" y2="37.7"/>
    <line x1="36" y1="36.3" x2="36" y2="37.7"/><line x1="41" y1="36.3" x2="41" y2="37.7"/>
    <line x1="46" y1="36.3" x2="46" y2="37.7"/><line x1="51" y1="36.3" x2="51" y2="37.7"/>
    <line x1="10.3" y1="34" x2="11.7" y2="34"/><line x1="10.3" y1="29" x2="11.7" y2="29"/>
    <line x1="10.3" y1="24" x2="11.7" y2="24"/><line x1="10.3" y1="19" x2="11.7" y2="19"/>
    <line x1="10.3" y1="14" x2="11.7" y2="14"/><line x1="10.3" y1="9" x2="11.7" y2="9"/>
  </g>
  <text class="label" x="24.4" y="40.5">15</text>
  <text class="label" x="29.4" y="40.5">20</text>
  <text class="label" x="34.4" y="40.5">25</text>
  <text class="label" x="39.4" y="40.5">30</text>
  <text class="label" x="44.4" y="40.5">35</text>
  <text class="label" x="49.4" y="40.5">40</text>
  <text class="label" x="1.2" y="35">1000</text>
  <text class="label" x="1.2" y="30">1100</text>
  <text class="label" x="1.2" y="25">1200</text>
  <text class="label" x="1.2" y="20">1300</text>
  <text class="label" x="1.2" y="15">1400</text>
  <text class="label" x="1.2" y="10">1500</text>
  <text class="axis-label" x="56" y="40.2">x</text>
  <text class="axis-label" x="8.5" y="3.8">y</text>
  <text class="label" x="6.5" y="40.5" style="font-size:4.1px">O</text>
</svg>
