<line class="dim" x1="55" y1="40" x2="55" y2="60"/>
<text class="unknown" x="50" y="53" text-anchor="middle">r</text>
<path class="dim" d="M45 20 Q60 13 75 20"/>
<text class="num" x="60" y="11" text-anchor="middle">6</text>
<path class="dim" d="M15 60 Q45 67 75 60"/>
