.point{fill:#000}
.num,.unknown,.area{fill:#000}
.num,.unknown{font-family:"CMU Serif","Latin Modern Roman","Times New Roman",serif;font-size:6px}
.unknown{font-style:italic}
.area{font-family:"Noto Sans CJK JP",sans-serif;font-size:6px}
</style>
<line class="main" x1="45" y1="20" x2="15" y2="60"/>
<line class="main" x1="15" y1="60" x2="75" y2="60"/>
