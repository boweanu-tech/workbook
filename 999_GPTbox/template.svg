  <!--
  教材SVGテンプレート。

  基本方針:
  - viewBox の 1 単位を 1mm として扱う。
  - TeX 側では原則として等倍または小さな倍率変更で使う。
  - 図の余白は必要最小限にする。
  - 図形本体は .main、補助線・関数グラフは .thin、点線は .dash を使う。
  - 座標平面では原点 O を必ず表示し、原則として第3象限側に置く。
  - 点名や関数式は、曲線・直線・座標軸と重ならない位置に置く。
  - どうしても重なる場合は、文字の背後に .label-bg を置く。
  - 面積を求める領域は灰色で塗るだけでなく、.triangle-outline などで実線の輪郭も描く。

  フォント:
  - lesson_07_setsudan_01.svg などとそろえるため、CMU Serif を第一候補にする。
  - 通常ラベルは .label、数式は .math-label、軸文字は .axis-label を使う。
  - 変数だけを .var で斜体にする。

  数式表記:
  - x² のようなUnicode上付き文字は使わない。
    <tspan class="var">x</tspan><tspan class="sup" dy="-1.45">2</tspan>
    のように上付き文字を組む。
  - 1/2 のようなスラッシュ分数は使わない。
    .frac-text と .frac-line を使い、縦型分数として組む。
  - 負号は互換性のため通常の半角ハイフン "-" を使う。

  作図精度:
  - 関数グラフ・点・補助線・塗り領域は、同じ数学座標から変換して配置する。
  - 角度弧は SVG の A コマンドを使う。
  - 直角記号、等辺印、平行記号は辺の方向ベクトルから配置する。
  - 軸の矢印は軸線と三角形を分け、軸線が矢印の先からはみ出ないようにする。
  -->
  <defs
     id="defs4">
    <style
       id="style2"><![CDATA[
      /* ========= 全体・ガイド ========= */
      .page-border {
        stroke: #bbbbbb;
        stroke-width: 0.2;
        fill: none;
      }
      .guide {
        stroke: #cccccc;
        stroke-width: 0.15;
        fill: none;
        stroke-dasharray: 1 1;
      }

      /* ========= 線 ========= */
      .main {
        stroke: black;
        stroke-width: 0.55;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.32;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.32;
        fill: none;
        stroke-dasharray: 1.2 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bold {
        stroke: black;
        stroke-width: 0.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .axis-arrow {
        fill: black;
        stroke: none;
      }

      /* ========= 点・文字 ========= */
      .point {
        fill: black;
        stroke: none;
      }
      .section-title,
      .note {
        font-family: "Noto Serif CJK JP", "IPAexMincho", "IPAMincho", serif;
        fill: black;
      }
      .label,
      .math-label,
      .axis-label,
      .angle-label,
      .frac-text {
        font-family: "CMU Serif", "Computer Modern Serif",
                     "Latin Modern Roman", "Times New Roman", serif;
        fill: black;
      }
      .section-title {
        font-size: 4px;
        font-weight: bold;
      }
      .note {
        font-size: 3px;
        fill: #555555;
      }
      .label {
        font-size: 4.1px;
        font-style: normal;
      }
      .math-label {
        font-size: 4px;
        font-style: normal;
      }
      .axis-label {
        font-size: 4px;
        font-style: italic;
      }
      .angle-label {
        font-size: 3.2px;
      }
      .var {
        font-style: italic;
      }
      .sup {
        font-size: 2.8px;
      }
      .frac-text {
        font-size: 3.2px;
      }
      .frac-line {
        stroke: black;
        stroke-width: 0.28;
      }
      .label-bg {
        fill: white;
        opacity: 0.92;
      }

      /* ========= 塗り ========= */
      .white-shape {
        fill: white;
        stroke: black;
        stroke-width: 0.55;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .light-fill {
        fill: #eeeeee;
        stroke: none;
      }
      .mid-fill,
      .triangle-fill {
        fill: #dddddd;
        stroke: none;
      }
      .triangle-outline {
        fill: none;
        stroke: black;
        stroke-width: 0.55;
        stroke-linejoin: round;
      }
    ]]></style>
  </defs>
