<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="160mm" height="110mm" viewBox="0 0 160 110">

  <!--
  教材SVGテンプレート。

  基本方針:
  - viewBox の 1 単位を 1mm として扱う。
  - TeX 側では原則として等倍または小さな倍率変更で使う。
  - 図の余白は必要最小限にする。
  - 図形本体は .main、補助線・関数グラフは .thin、点線は .dash を使う。
  - 座標平面では原点 O を必ず表示し、原則として第3象限側に置く。
  - 点名や関数式は、曲線・直線・座標軸と重ならない位置に置く。
  - どうしても重なる場合は、文字の背後に .label-bg を置く。
  - 面積を求める領域は灰色で塗るだけでなく、.triangle-outline などで実線の輪郭も描く。

  フォント:
  - lesson_07_setsudan_01.svg などとそろえるため、CMU Serif を第一候補にする。
  - 通常ラベルは .label、数式は .math-label、軸文字は .axis-label を使う。
  - 変数だけを .var で斜体にする。

  数式表記:
  - x² のようなUnicode上付き文字は使わない。
    <tspan class="var">x</tspan><tspan class="sup" dy="-1.45">2</tspan>
    のように上付き文字を組む。
  - 1/2 のようなスラッシュ分数は使わない。
    .frac-text と .frac-line を使い、縦型分数として組む。
  - 負号は互換性のため通常の半角ハイフン "-" を使う。

  作図精度:
  - 関数グラフ・点・補助線・塗り領域は、同じ数学座標から変換して配置する。
  - 角度弧は SVG の A コマンドを使う。
  - 直角記号、等辺印、平行記号は辺の方向ベクトルから配置する。
  - 軸の矢印は軸線と三角形を分け、軸線が矢印の先からはみ出ないようにする。
  -->

  <defs>
    <style><![CDATA[
      /* ========= 全体・ガイド ========= */
      .page-border {
        stroke: #bbbbbb;
        stroke-width: 0.2;
        fill: none;
      }
      .guide {
        stroke: #cccccc;
        stroke-width: 0.15;
        fill: none;
        stroke-dasharray: 1 1;
      }

      /* ========= 線 ========= */
      .main {
        stroke: black;
        stroke-width: 0.55;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        stroke: black;
        stroke-width: 0.32;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        stroke: black;
        stroke-width: 0.32;
        fill: none;
        stroke-dasharray: 1.2 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bold {
        stroke: black;
        stroke-width: 0.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .axis-arrow {
        fill: black;
        stroke: none;
      }

      /* ========= 点・文字 ========= */
      .point {
        fill: black;
        stroke: none;
      }
      .section-title,
      .note {
        font-family: "Noto Serif CJK JP", "IPAexMincho", "IPAMincho", serif;
        fill: black;
      }
      .label,
      .math-label,
      .axis-label,
      .angle-label,
      .frac-text {
        font-family: "CMU Serif", "Computer Modern Serif",
                     "Latin Modern Roman", "Times New Roman", serif;
        fill: black;
      }
      .section-title {
        font-size: 4px;
        font-weight: bold;
      }
      .note {
        font-size: 3px;
        fill: #555555;
      }
      .label {
        font-size: 4.1px;
        font-style: normal;
      }
      .math-label {
        font-size: 4px;
        font-style: normal;
      }
      .axis-label {
        font-size: 4px;
        font-style: italic;
      }
      .angle-label {
        font-size: 3.2px;
      }
      .var {
        font-style: italic;
      }
      .sup {
        font-size: 2.8px;
      }
      .frac-text {
        font-size: 3.2px;
      }
      .frac-line {
        stroke: black;
        stroke-width: 0.28;
      }
      .label-bg {
        fill: white;
        opacity: 0.92;
      }

      /* ========= 塗り ========= */
      .white-shape {
        fill: white;
        stroke: black;
        stroke-width: 0.55;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .light-fill {
        fill: #eeeeee;
        stroke: none;
      }
      .mid-fill,
      .triangle-fill {
        fill: #dddddd;
        stroke: none;
      }
      .triangle-outline {
        fill: none;
        stroke: black;
        stroke-width: 0.55;
        stroke-linejoin: round;
      }
    ]]></style>
  </defs>

  <rect class="page-border" x="1" y="1" width="158" height="108"/>
  <rect class="guide" x="5" y="5" width="150" height="100"/>

  <!-- ========= 1. 線 ========= -->
  <text class="section-title" x="8" y="10">1. 線</text>
  <line class="main" x1="10" y1="18" x2="55" y2="18"/>
  <text class="note" x="58" y="19">.main</text>
  <line class="thin" x1="10" y1="25" x2="55" y2="25"/>
  <text class="note" x="58" y="26">.thin</text>
  <line class="dash" x1="10" y1="32" x2="55" y2="32"/>
  <text class="note" x="58" y="33">.dash</text>
  <line class="bold" x1="10" y1="39" x2="55" y2="39"/>
  <text class="note" x="58" y="40">.bold</text>

  <!-- ========= 2. 点・ラベル ========= -->
  <text class="section-title" x="8" y="51">2. 点・ラベル</text>
  <circle class="point" cx="18" cy="61" r="0.4"/>
  <text class="label" x="14" y="58">A</text>
  <circle class="point" cx="38" cy="61" r="0.4"/>
  <text class="label" x="40" y="63">B</text>
  <line class="thin" x1="18" y1="61" x2="38" y2="61"/>

  <!-- Unicode上付き文字を使わない x^2 の例 -->
  <rect class="label-bg" x="12" y="67" width="21" height="6" rx="0.4"/>
  <text class="math-label" x="14" y="71">
    <tspan class="var">y</tspan>=
    <tspan class="var">x</tspan><tspan class="sup" dy="-1.45">2</tspan>
  </text>

  <!-- 縦型分数の例 y=(1/2)x^2 -->
  <g transform="translate(38,71)">
    <rect class="label-bg" x="-1" y="-5" width="24" height="8" rx="0.4"/>
    <text class="math-label" x="0" y="0"><tspan class="var">y</tspan>=</text>
    <text class="frac-text" x="6.3" y="-1.45" text-anchor="middle">1</text>
    <line class="frac-line" x1="4.8" y1="-0.65" x2="7.8" y2="-0.65"/>
    <text class="frac-text" x="6.3" y="2.15" text-anchor="middle">2</text>
    <text class="math-label" x="9.2" y="0">
      <tspan class="var">x</tspan><tspan class="sup" dy="-1.45">2</tspan>
    </text>
  </g>

  <!-- ========= 3. 記号 ========= -->
  <text class="section-title" x="88" y="10">3. 記号</text>
  <path class="main" d="M 95 38 L 120 18 L 142 38 Z"/>
  <text class="label" x="91" y="43">A</text>
  <text class="label" x="118" y="15">B</text>
  <text class="label" x="144" y="43">C</text>
  <path class="thin" d="M 98.12 35.50 A 4 4 0 0 1 99 38"/>
  <text class="angle-label" x="100" y="37">60°</text>
  <path class="thin" d="M 120 35.5 L 122.5 35.5 L 122.5 38"/>

  <line class="main" x1="94" y1="50" x2="126" y2="50"/>
  <path class="thin" d="M 109.4 49 L 110.6 51"/>
  <line class="main" x1="94" y1="57" x2="126" y2="57"/>
  <path class="thin" d="M 108.8 56 L 110.0 58"/>
  <path class="thin" d="M 110.1 56 L 111.3 58"/>

  <!-- ========= 4. 座標軸 ========= -->
  <text class="section-title" x="8" y="82">4. 座標軸</text>
  <line class="main" x1="12" y1="101" x2="68" y2="101"/>
  <polygon class="axis-arrow" points="70,101 67.3,100.05 67.3,101.95"/>
  <line class="main" x1="34" y1="106" x2="34" y2="84"/>
  <polygon class="axis-arrow" points="34,82 33.05,84.7 34.95,84.7"/>
  <text class="label" x="30.2" y="105">O</text>
  <text class="axis-label" x="72" y="102">x</text>
  <text class="axis-label" x="36" y="85">y</text>
  <path class="thin" d="M 18 89 C 27 104, 42 104, 54 89"/>

  <!-- ========= 5. 塗りと輪郭 ========= -->
  <text class="section-title" x="88" y="72">5. 面積領域</text>
  <polygon class="triangle-fill" points="94,103 119,78 148,103"/>
  <polygon class="triangle-outline" points="94,103 119,78 148,103"/>
  <text class="label" x="90" y="108">A</text>
  <text class="label" x="117" y="75">B</text>
  <text class="label" x="150" y="108">C</text>
  <text class="note" x="92" y="69">灰色の塗り＋実線の輪郭</text>
</svg>
