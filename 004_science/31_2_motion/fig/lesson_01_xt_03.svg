<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60mm" height="42mm" viewBox="0 0 60 42">
  <defs>
    <style><![CDATA[
      .main{stroke:black;stroke-width:0.55;fill:none;stroke-linecap:round;stroke-linejoin:round;}
      .thin{stroke:black;stroke-width:0.32;fill:none;stroke-linecap:round;stroke-linejoin:round;}
      .dash{stroke:black;stroke-width:0.32;fill:none;stroke-dasharray:1.2 1.4;stroke-linecap:round;stroke-linejoin:round;}
      .bold{stroke:black;stroke-width:0.75;fill:none;stroke-linecap:round;stroke-linejoin:round;}
      .grid{stroke:#d8d8d8;stroke-width:0.18;fill:none;}
      .axis-arrow{fill:black;stroke:none;}
      .point{fill:black;stroke:none;}
      .label,.math-label,.axis-label,.tick{font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;fill:black;}
      .label{font-size:4.1px;font-style:normal;}
      .math-label{font-size:4px;font-style:normal;}
      .axis-label{font-size:4px;font-style:italic;}
      .tick{font-size:3px;font-style:normal;}
      .var{font-style:italic;}
    ]]></style>
  </defs>
  <rect x="0" y="0" width="60" height="42" fill="white"/>
  <g transform="translate(9,33)">
