    <polygon class="axis-arrow" points="45,0 42.3,-0.95 42.3,0.95"/>
    <line class="main" x1="0" y1="0" x2="0" y2="-26"/>
    <polygon class="axis-arrow" points="0,-28 -0.95,-25.3 0.95,-25.3"/>

