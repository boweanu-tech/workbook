<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  viewBoxの1単位を1mmとし、図形は座標計算に基づいて配置する。
  糸の方向ベクトルは (14,18)。角度弧の終点は、このベクトルを
  半径5に正規化して求めた (23.068,7.945) とする。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .point { fill:#000; stroke:none; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .label, .math-label, .angle-label {
        font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;
        fill:#000;
      }
      .label { font-size:3.5px; font-style:normal; }
      .math-label { font-size:3.5px; font-style:italic; }
      .angle-label { font-size:3.2px; font-style:italic; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <ellipse class="thin" cx="20" cy="22" rx="15" ry="4.2" />
  <line class="dash" x1="20" y1="2" x2="20" y2="28" />
  <line class="main" x1="20" y1="4" x2="34" y2="22" />
  <line class="dash" x1="20" y1="22" x2="34" y2="22" />
  <circle class="point" cx="20" cy="4" r="0.65" />
  <circle class="white-shape" cx="34" cy="22" r="1.7" />
  <path class="thin" d="M20 9 A5 5 0 0 0 23.068 7.945" />
  <path class="thin" d="M10.2 25.3 A15 4.2 0 0 0 7.2 22.8" />
  <polygon class="axis-arrow" points="7.2,22.8 7.65,24.45 8.7,23.2" />
  <text class="label" x="17.2" y="3.2">O</text>
  <text class="angle-label" x="21.2" y="10.7">θ</text>
  <text class="math-label" x="27.7" y="11.4">ℓ</text>
  <text class="math-label" x="26.2" y="20.7">r</text>
  <text class="math-label" x="5.3" y="27.7">ω</text>
</svg>
