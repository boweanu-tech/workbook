<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  ばねの自然長に対応する下端を y=10、つり合い時の下端を y=20 とし、
  その差を x_0 として示す。下向きを変位 y の正方向とする。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .label, .math-label { font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif; fill:#000; }
      .label { font-size:3.4px; font-style:normal; }
      .math-label { font-size:3.5px; font-style:italic; }
      .sub { font-size:2.6px; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <line class="main" x1="8" y1="3" x2="34" y2="3" />
  <g class="thin">
    <line x1="10" y1="1" x2="8" y2="3" />
    <line x1="15" y1="1" x2="13" y2="3" />
    <line x1="20" y1="1" x2="18" y2="3" />
    <line x1="25" y1="1" x2="23" y2="3" />
    <line x1="30" y1="1" x2="28" y2="3" />
    <line x1="35" y1="1" x2="33" y2="3" />
  </g>
  <path class="main" d="M21 3 V5 L18 6.5 L24 8.5 L18 10.5 L24 12.5 L18 14.5 L24 16.5 L18 18.5 L21 20" />
  <rect class="white-shape" x="17" y="20" width="8" height="6" rx="0.4" />
  <line class="dash" x1="9" y1="10" x2="33" y2="10" />
  <line class="thin" x1="30" y1="10" x2="30" y2="20" />
  <polygon class="axis-arrow" points="30,10 29.3,11.6 30.7,11.6" />
  <polygon class="axis-arrow" points="30,20 29.3,18.4 30.7,18.4" />
  <line class="thin" x1="36" y1="17" x2="36" y2="26" />
  <polygon class="axis-arrow" points="36,28 35,25.2 37,25.2" />
  <text class="math-label" x="14.5" y="12.6">k</text>
  <text class="math-label" x="19.6" y="24.2">m</text>
  <text class="math-label" x="31.1" y="16.2">x<tspan class="sub" dy="1.0">0</tspan></text>
  <text class="math-label" x="37" y="24">y</text>
</svg>
