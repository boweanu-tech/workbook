<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  回転台は中心 (21,17)、半径方向はベクトル (12,-4) として配置する。
  小物体の位置と半径の補助線は同一の座標から決定する。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .light-fill { fill:#eee; stroke:none; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .point { fill:#000; stroke:none; }
      .label, .math-label {
        font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;
        fill:#000;
      }
      .label { font-size:3.5px; font-style:normal; }
      .math-label { font-size:3.5px; font-style:italic; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <ellipse class="light-fill" cx="21" cy="17" rx="17" ry="7" />
  <ellipse class="main" cx="21" cy="17" rx="17" ry="7" />
  <line class="dash" x1="21" y1="2" x2="21" y2="27.5" />
  <line class="dash" x1="21" y1="17" x2="33" y2="13" />
  <circle class="point" cx="21" cy="17" r="0.55" />
  <rect class="white-shape" x="31.4" y="10.2" width="3.2" height="3.2" rx="0.35" />
  <path class="thin" d="M14 6.4 C18 3.6 25 3.6 29 6.4" />
  <polygon class="axis-arrow" points="29,6.4 27.2,6.3 28.15,4.95" />
  <text class="label" x="18.1" y="20.5">O</text>
  <text class="math-label" x="26.1" y="13.5">r</text>
  <text class="math-label" x="20" y="5.2">ω</text>
</svg>
