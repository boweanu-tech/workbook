<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  円錐の右母線は (20,27) から (37,3) までとし、水平面との角は
  arctan(24/17)。小球中心は接点から内向き単位法線方向へ1.5移動して
  (29.975,10.322) とした。角度弧も同じ母線の角度から算出する。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .math-label, .angle-label {
        font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif;
        fill:#000; font-style:italic;
      }
      .math-label { font-size:3.5px; }
      .angle-label { font-size:3.2px; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <line class="main" x1="3" y1="3" x2="20" y2="27" />
  <line class="main" x1="20" y1="27" x2="37" y2="3" />
  <line class="dash" x1="20" y1="1.5" x2="20" y2="28.5" />
  <ellipse class="thin" cx="20" cy="10.322" rx="9.975" ry="2.8" />
  <line class="dash" x1="20" y1="10.322" x2="29.975" y2="10.322" />
  <circle class="white-shape" cx="29.975" cy="10.322" r="1.5" />
  <line class="thin" x1="20" y1="27" x2="28" y2="27" />
  <path class="thin" d="M25 27 A5 5 0 0 0 22.891 22.918" />
  <path class="thin" d="M13.5 12.45 A9.975 2.8 0 0 0 10.3 10.9" />
  <polygon class="axis-arrow" points="10.3,10.9 11.1,12.4 12.0,11.0" />
  <text class="angle-label" x="25.1" y="24.1">θ</text>
  <text class="math-label" x="24.2" y="9.2">r</text>
  <text class="math-label" x="8.6" y="14.7">v</text>
</svg>
