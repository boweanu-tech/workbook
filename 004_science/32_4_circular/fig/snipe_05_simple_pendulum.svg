<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  支点を (19,4)、小球を (32,20) とし、糸の方向ベクトルを (13,16) とする。
  角度弧の終点は、この方向ベクトルを半径5に正規化して求める。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .point { fill:#000; stroke:none; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .label, .math-label, .angle-label { font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif; fill:#000; }
      .label { font-size:3.4px; font-style:normal; }
      .math-label { font-size:3.5px; font-style:italic; }
      .angle-label { font-size:3.2px; font-style:italic; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <line class="dash" x1="19" y1="3" x2="19" y2="27" />
  <line class="main" x1="19" y1="4" x2="32" y2="20" />
  <circle class="point" cx="19" cy="4" r="0.65" />
  <circle class="white-shape" cx="32" cy="20" r="1.8" />
  <path class="thin" d="M19 9 A5 5 0 0 0 22.154 7.883" />
  <path class="thin" d="M19 24.616 A20.616 20.616 0 0 0 30.300 21.240" />
  <polygon class="axis-arrow" points="30.300,21.240 28.420,21.640 29.180,22.810" />
  <text class="label" x="16.2" y="3.2">O</text>
  <text class="angle-label" x="20.3" y="10.6">θ</text>
  <text class="math-label" x="26.1" y="10.8">ℓ</text>
  <text class="math-label" x="25.2" y="25.8">x</text>
  <text class="math-label" x="34.2" y="21.2">m</text>
</svg>
