<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="42mm" height="30mm" viewBox="0 0 42 30" version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <!--
  教材SVGテンプレート準拠。
  つり合いの位置を x=0 とし、物体の中心までの水平距離を変位 x として描く。
  ばねの折れ線は同じ中心線 y=15 の上下3mmに配置する。
  -->
  <defs>
    <style><![CDATA[
      .main { stroke:#000; stroke-width:0.55; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#000; stroke-width:0.32; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#000; stroke-width:0.32; fill:none; stroke-dasharray:1.2 1.4; stroke-linecap:round; }
      .white-shape { fill:#fff; stroke:#000; stroke-width:0.55; }
      .label, .math-label { font-family:"CMU Serif","Computer Modern Serif","Latin Modern Roman","Times New Roman",serif; fill:#000; }
      .label { font-size:3.4px; font-style:normal; }
      .math-label { font-size:3.5px; font-style:italic; }
      .axis-arrow { fill:#000; stroke:none; }
    ]]></style>
  </defs>
  <line class="main" x1="3" y1="4" x2="3" y2="23" />
  <g class="thin">
    <line x1="0.8" y1="6" x2="3" y2="4" />
    <line x1="0.8" y1="10" x2="3" y2="8" />
    <line x1="0.8" y1="14" x2="3" y2="12" />
    <line x1="0.8" y1="18" x2="3" y2="16" />
    <line x1="0.8" y1="22" x2="3" y2="20" />
  </g>
  <path class="main" d="M3 15 H7 L9.5 12 L12.5 18 L15.5 12 L18.5 18 L21.5 12 L24.5 18 L27 15 H30" />
  <rect class="white-shape" x="30" y="11" width="7" height="8" rx="0.4" />
  <line class="main" x1="2" y1="21" x2="39" y2="21" />
  <line class="dash" x1="24" y1="6" x2="24" y2="22" />
  <line class="thin" x1="24.8" y1="7.5" x2="32.8" y2="7.5" />
  <polygon class="axis-arrow" points="24.8,7.5 26.4,6.8 26.4,8.2" />
  <polygon class="axis-arrow" points="32.8,7.5 31.2,6.8 31.2,8.2" />
  <text class="math-label" x="14" y="11">k</text>
  <text class="math-label" x="32.1" y="16.2">m</text>
  <text class="math-label" x="27.8" y="6.3">x</text>
  <text class="label" x="20.2" y="25.5">x=0</text>
</svg>
